<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - CourseAI</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/auth.css">
</head>

<body class="auth-page">

<div class="auth-card">

    <a href="index.html"
       class="logo">
        🤖 CourseAI
    </a>

    <h1>Create Account</h1>

    <p class="auth-subtitle">
        Start building personalized courses with AI.
    </p>

    <form id="signupForm">

        <label>Full Name</label>

        <input
            type="text"
            id="fullName"
            placeholder="Your full name"
            required>

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required>

        <label>Role</label>

        <select id="role">

            <option value="student">
                Student
            </option>

            <option value="instructor">
                Instructor
            </option>

        </select>

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Minimum 8 characters"
            required>

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            required>

        <label class="checkbox-row">

            <input
                type="checkbox"
                id="terms">

            I agree to the terms.

        </label>

        <button
            type="submit"
            class="primary-btn">
            Create Account
        </button>

    </form>

    <p class="auth-bottom">
        Already have an account?
        <a href="login.html">
            Login
        </a>
    </p>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
