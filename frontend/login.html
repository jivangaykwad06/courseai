<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CourseAI</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/auth.css">
</head>

<body class="auth-page">

<div class="auth-card">

    <a href="index.html"
       class="logo">
        🤖 CourseAI
    </a>

    <h1>Welcome Back</h1>

    <p class="auth-subtitle">
        Login to continue learning.
    </p>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required>

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required>

        <label class="checkbox-row">

            <input
                type="checkbox"
                id="rememberMe">

            Remember me

        </label>

        <button
            type="submit"
            class="primary-btn">
            Login
        </button>

    </form>

    <p class="auth-bottom">
        Don't have an account?
        <a href="signup.html">
            Create one
        </a>
    </p>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
