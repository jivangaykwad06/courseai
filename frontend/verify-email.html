<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Email - CourseAI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8f7ff
                );
        }

        .verify-card {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 45px 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.10);
        }

        .logo {
            font-size: 30px;

            font-weight: 800;

            color: #3155D9;

            margin-bottom: 10px;
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: 25px auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eef2ff;

            font-size: 38px;
        }

        h1 {
            margin: 10px 0;

            font-size: 28px;

            color: #222;
        }

        p {
            color: #666;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .status {
            padding: 14px 18px;

            border-radius: 10px;

            background: #f3f4f6;

            color: #555;

            margin-bottom: 25px;
        }

        .success {
            background: #dcfce7;

            color: #166534;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;
        }

        .login-btn {
            display: none;

            padding: 13px 28px;

            border-radius: 10px;

            background: #3155D9;

            color: white;

            text-decoration: none;

            font-weight: 700;
        }

        .login-btn:hover {
            background: #2645b8;
        }

        .loader {
            width: 35px;
            height: 35px;

            margin: 25px auto;

            border: 4px solid #e5e7eb;

            border-top-color: #3155D9;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>

    <div class="verify-card">

        <div class="logo">
            🤖 CourseAI
        </div>

        <div class="icon">
            ✉️
        </div>

        <h1>
            Verify Your Email
        </h1>

        <p>
            We are verifying your CourseAI account.
            Please wait a moment.
        </p>

        <div
            id="loader"
            class="loader"
        ></div>

        <div
            id="status"
            class="status"
        >
            Verifying your email...
        </div>

        <a
            id="loginButton"
            class="login-btn"
            href="login.html"
        >
            Go to Login
        </a>

    </div>


    <script>

        async function verifyEmail() {

            const status =
                document.getElementById(
                    "status"
                );

            const loader =
                document.getElementById(
                    "loader"
                );

            const loginButton =
                document.getElementById(
                    "loginButton"
                );


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const token =
                params.get("token");


            if (!token) {

                loader.style.display =
                    "none";

                status.textContent =
                    "Invalid verification link.";

                status.className =
                    "status error";

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/auth/verify/${encodeURIComponent(token)}`
                    );


                const result =
                    await response.json();


                loader.style.display =
                    "none";


                if (result.success) {

                    status.textContent =
                        result.message ||
                        "Email verified successfully.";

                    status.className =
                        "status success";

                    loginButton.style.display =
                        "inline-block";

                } else {

                    status.textContent =
                        result.message ||
                        "Email verification failed.";

                    status.className =
                        "status error";
                }


            } catch (error) {

                console.error(
                    "Verification error:",
                    error
                );

                loader.style.display =
                    "none";

                status.textContent =
                    "Unable to verify email. Please try again.";

                status.className =
                    "status error";
            }

        }


        document.addEventListener(
            "DOMContentLoaded",
            verifyEmail
        );

    </script>

</body>

</html>
